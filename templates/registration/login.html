<!doctype html>
<html>
  <body>
    <h1>Prihlásenie</h1>
    {% if form.errors %}
      <p>Nesprávne meno alebo heslo.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div>
        <label>Používateľské meno:</label>
        <input type="text" name="username" autofocus />
      </div>
      <div>
        <label>Heslo:</label>
        <input type="password" name="password" />
      </div>
      <button type="submit">Prihlásiť sa</button>
    </form>
  </body>
</html>
